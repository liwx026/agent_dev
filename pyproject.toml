[project]
name = "agent-dev"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "openai (>=3.3.1,<4.0.0)",
    "langchain (>=1.3.17,<2.0.0)",
    "langchain-classic (>=1.0.8,<2.0.0)",
    "langchain-openai (>=1.1.0,<2.0.0)",
    "deepagents (>=0.7.9,<0.8.0)",
    "langgraph-checkpoint-postgres (>=3.1.2,<4.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)"
]

[tool.poetry]
packages = [{include = "agent_dev", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
